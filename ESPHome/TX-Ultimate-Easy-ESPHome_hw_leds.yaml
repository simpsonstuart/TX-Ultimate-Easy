####################################################################################################
##### Purpose: ESPHome - Hardware - LEDs                                                       #####
####################################################################################################
##### Author: edwardtfn - https://github.com/edwardtfn - https://buymeacoffee.com/edwardfirmo  #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Make changes ONLY if absolutely necessary and you have the required knowledge.         #####
##### - For normal system use, modifications to this file are NOT required.                    #####
####################################################################################################
---
substitutions:
  default_transition_length: 500ms

  LIGHT_MODE_BOTH_TEXT: "Both"
  LIGHT_MODE_DISABLED_TEXT: "Disabled"
  LIGHT_MODE_LEFT_TEXT: "Left"
  LIGHT_MODE_RIGHT_TEXT: "Right"
  LIGHT_MODE_BOTTOM_TEXT: "Bottom"
  LIGHT_MODE_TOP_TEXT: "Top"
  LIGHT_MODE_BOTTOM_OR_LEFT_TEXT: ${LIGHT_MODE_BOTTOM_TEXT if IS_EU_MODEL else LIGHT_MODE_LEFT_TEXT}
  LIGHT_MODE_TOP_OR_RIGHT_TEXT: ${LIGHT_MODE_TOP_TEXT if IS_EU_MODEL else LIGHT_MODE_RIGHT_TEXT}

  LIGHT_TRANSITION_TURN_ON: 0   # Transition time in msec
  LIGHT_TRANSITION_TURN_OFF: 0  # Transition time in msec
  LIGHT_BRIGHTNESS_TURN_ON: 0   # Brightness (1 to 100%, 0 to not set it)

  LIGHT_FULL_RESTORE_MODE: RESTORE_DEFAULT_OFF
  LIGHT_SIDES_RESTORE_MODE: RESTORE_DEFAULT_OFF

  STATUS_WAVE_EFFECT_NAME: "Calm Aqua Wave"
  STATUS_WAVE_DEFAULT_BRIGHTNESS: "35"
  STATUS_WAVE_PRESS_PULSE_DURATION: "550"  # Whole-strip press pulse, in ms

  LIGHT_LED_COUNT: ${28 if IS_EU_MODEL else 32}
  LIGHT_MAX_ADDR: ${27 if IS_EU_MODEL else 31}

  TAG_HW_LEDS: tx_ultimate_easy.hw.leds

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_HW_LEDS

globals:
  - id: status_wave_press_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: status_wave_press_started_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

.light_partition_sides: &light_partition_sides
  platform: partition
  default_transition_length: ${default_transition_length}
  disabled_by_default: true
  internal: false
  restore_mode: ${LIGHT_SIDES_RESTORE_MODE}
  effects:
    - pulse:
        name: "Pulse"
        transition_length: 1s
        update_interval: 1s
    - pulse:
        name: "Pulse - Slow"
        transition_length: 2s
        update_interval: 2s
    - addressable_scan:
        name: "Scan"
        move_interval: 100ms
        scan_width: 3
    - addressable_twinkle:
        name: "Twinkle"
        twinkle_probability: 5%
        progress_interval: 4ms
    - addressable_random_twinkle:
        name: "Random Twinkle"
        twinkle_probability: 20%
        progress_interval: 32ms
    - addressable_fireworks:
        name: "Fireworks"
        update_interval: 32ms
        spark_probability: 10%
        use_random_color: false
        fade_out_rate: 120
    - addressable_flicker:
        name: "Flicker"
        update_interval: 16ms
        intensity: 5%
    - random:
        name: "Random"

light:
  # These lights are controlling the LEDs on the device
  - id: light_full
    name: Light - All
    internal: true
    num_leds: 32
    pin: GPIO13
    restore_mode: ${LIGHT_FULL_RESTORE_MODE}
    platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    max_refresh_rate: 33ms
    use_psram: false
    # platform: neopixelbus
    # type: GRB
    # variant: WS2811

  # Those lights are available based on the model selections
  - id: lights_all
    name: Lights (all)
    platform: partition
    default_transition_length: ${default_transition_length}
    internal: false
    restore_mode: ${LIGHT_SIDES_RESTORE_MODE}
    effects:
      - addressable_lambda:
          name: "${STATUS_WAVE_EFFECT_NAME}"
          update_interval: 40ms
          lambda: |-
            // A soft, slow aqua wave travels around the perimeter.
            static uint32_t effect_started_at = 0;
            if (initial_run) {
              effect_started_at = millis();
            }

            // Night Mode uses another full-strip partition. Pause this writer
            // so its fixed color always wins, then resume on the next frame.
            #ifdef TX_ULTIMATE_EASY_NIGHT_MODE
            if (sw_night_mode->state) return;
            #endif

            const uint32_t now = millis();
            const float elapsed = static_cast<float>(now - effect_started_at) / 1000.0f;
            const float two_pi = 6.28318530718f;

            // A press temporarily replaces the spatial wave with one uniform
            // blue pulse. The wave clock keeps advancing and resumes in-place.
            if (id(status_wave_press_active)) {
              const uint32_t press_started_at = id(status_wave_press_started_at);
              const uint32_t press_elapsed = now - press_started_at;
              if (press_elapsed < ${STATUS_WAVE_PRESS_PULSE_DURATION}) {
                const float progress = static_cast<float>(press_elapsed) /
                                       static_cast<float>(${STATUS_WAVE_PRESS_PULSE_DURATION});
                const float pulse = 0.68f + 0.32f * sinf(progress * 3.14159265359f);
                const uint8_t red = static_cast<uint8_t>(10.0f * pulse);
                const uint8_t green = static_cast<uint8_t>(70.0f * pulse);
                const uint8_t blue = static_cast<uint8_t>(230.0f * pulse);
                it.all() = Color(red, green, blue);
                return;
              }
              id(status_wave_press_active) = false;
            }

            // Keep both the spatial and breathing contrast deliberately low.
            // This makes adjacent pixels blend visually instead of appearing
            // as separate bright/dark steps on the short 28/32-pixel strip.
            const float breathing = 0.93f + 0.07f * sinf(elapsed * 0.38f);
            for (size_t led = 0; led < it.size(); led++) {
              const float position = static_cast<float>(led) / static_cast<float>(it.size());
              const float wave = 0.5f + 0.5f * sinf(position * two_pi - elapsed * 0.38f);
              const uint8_t red = static_cast<uint8_t>((4.0f + 6.0f * wave) * breathing);
              const uint8_t green = static_cast<uint8_t>((88.0f + 38.0f * wave) * breathing);
              const uint8_t blue = static_cast<uint8_t>((100.0f + 38.0f * wave) * breathing);
              it[led] = Color(red, green, blue);
            }
      - addressable_rainbow:
          name: "Rainbow"
          width: ${LIGHT_LED_COUNT}
      - addressable_rainbow:
          name: "Rainbow - Fast"
          width: ${LIGHT_LED_COUNT}
          speed: 50
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Pulse - Slow"
          transition_length: 2s
          update_interval: 2s
      - addressable_scan:
          name: "Scan"
          move_interval: 100ms
          scan_width: 3
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 5%
          progress_interval: 4ms
      - addressable_random_twinkle:
          name: "Random Twinkle"
          twinkle_probability: 20%
          progress_interval: 32ms
      - addressable_fireworks:
          name: "Fireworks"
          update_interval: 32ms
          spark_probability: 10%
          use_random_color: false
          fade_out_rate: 120
      - addressable_flicker:
          name: "Flicker"
          update_interval: 16ms
          intensity: 5%
      - random:
          name: "Random"
    segments:
      - id: light_full
        from: 0
        to: ${LIGHT_MAX_ADDR}
    on_turn_off:
      then:
        - lambda: |-
            #ifdef TX_ULTIMATE_EASY_NIGHT_MODE
            if (sw_night_mode->state) { night_mode_apply->execute(); }
            #endif
            #ifdef TX_ULTIMATE_EASY_HW_RELAYS
            show_relay_status->execute();
            #endif

  - id: light_bottom
    name: Light - Bottom
    <<: *light_partition_sides
    segments:
      - id: light_full
        from: ${6 if IS_EU_MODEL else 9}
        to: ${12 if IS_EU_MODEL else 14}
        reversed: true
  - id: light_left
    name: Light - Left
    <<: *light_partition_sides
    segments:
      - id: light_full
        from: ${13 if IS_EU_MODEL else 15}
        to: ${19 if IS_EU_MODEL else 24}
        reversed: true
  - id: light_right
    name: Light - Right
    <<: *light_partition_sides
    segments:
      - id: light_full
        from: ${27 if IS_EU_MODEL else 31}
        to: ${27 if IS_EU_MODEL else 31}
        reversed: false
      - id: light_full
        from: 0
        to: ${5 if IS_EU_MODEL else 8}
        reversed: false
  - id: light_top
    name: Light - Top
    <<: *light_partition_sides
    segments:
      - id: light_full
        from: ${20 if IS_EU_MODEL else 25}
        to: ${26 if IS_EU_MODEL else 30}
        reversed: false

switch:
  - id: sw_status_wave_enabled
    name: Calm wave
    platform: template
    icon: mdi:waves
    entity_category: config
    internal: false
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - light.turn_on:
          id: lights_all
          brightness: ${STATUS_WAVE_DEFAULT_BRIGHTNESS}%
          effect: "${STATUS_WAVE_EFFECT_NAME}"
    turn_off_action:
      - light.turn_off:
          id: lights_all
          transition_length: 0s
      - lambda: |-
          #ifdef TX_ULTIMATE_EASY_HW_RELAYS
          show_relay_status->execute();
          #endif

script:
  - id: !extend touch_on_press
    then:
      - lambda: |-
          // Restrict feedback to mapped button regions. Repeated presses restart
          // the pulse cleanly without restarting the underlying wave effect.
          if (!sw_status_wave_enabled->state || button < 1 || button > ${gang_count}) return;
          id(status_wave_press_started_at) = millis();
          id(status_wave_press_active) = true;

  - id: !extend boot_done
    then:
      # The restored switch state is available by boot_done. Starting the effect
      # here also enables it after upgrading from firmware that did not have it.
      - if:
          condition:
            - switch.is_on: sw_status_wave_enabled
          then:
            - light.turn_on:
                id: lights_all
                brightness: ${STATUS_WAVE_DEFAULT_BRIGHTNESS}%
                effect: "${STATUS_WAVE_EFFECT_NAME}"

  - id: !extend dump_config
    then:
      - lambda: |-
          ESP_LOGCONFIG("${TAG_HW_LEDS}", "Transition times:\n"
                                          "  Default:     ${default_transition_length}\n"
                                          "  Turning on:  ${LIGHT_TRANSITION_TURN_ON ~ 'ms' if LIGHT_TRANSITION_TURN_ON > 0 else 'Disabled'}\n"
                                          "  Turning off: ${LIGHT_TRANSITION_TURN_OFF ~ 'ms' if LIGHT_TRANSITION_TURN_OFF > 0 else 'Disabled'}");
          ESP_LOGCONFIG("${TAG_HW_LEDS}", "LED restore modes:\n"
                                          "  Light - All: ${LIGHT_FULL_RESTORE_MODE}\n"
                                          "  Sides:       ${LIGHT_SIDES_RESTORE_MODE}");

  - id: !extend dump_config_list_packages
    then:
      - script.wait: dump_config
      - lambda: |-
          // Check for requirements
          #ifndef TX_ULTIMATE_EASY_COMMON
            #error "The package TX-Ultimate-Easy-ESPHome_common.yaml is required."
          #endif

          // Identify itself
          ESP_LOGCONFIG(ESPHOME_PROJECT_NAME, "  - Hardware - LEDs");
...
